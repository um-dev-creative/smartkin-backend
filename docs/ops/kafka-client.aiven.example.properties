# Example client.properties for scripts/kafka-create-topics.sh against an Aiven for Apache Kafka service.
# Copy it OUTSIDE the repository (for example ~/kafka-aiven/client.properties), fill it in and keep that folder private (chmod 700):
# it points at credentials. Never commit the real file.
#
# Put every file it names in the SAME folder as the properties file and write its path as you see it on your machine
# (/Users/you/kafka-aiven/ca.pem) or as /etc/kafka-client/ca.pem: the script rewrites the first form for the container.
#
#   export KAFKA_BOOTSTRAP_SERVERS=<service host:port of the method you chose>
#   export KAFKA_CLIENT_PROPERTIES=$HOME/kafka-aiven/client.properties
#   ./scripts/kafka-create-topics.sh --dry-run && ./scripts/kafka-create-topics.sh
#
# Aiven shows a different host:port for each authentication method (Overview > Connection information).

# ---- Option A: client certificate (Aiven's default) -------------------------------------------------------------------------------
# Files from the Aiven console: ca.pem, service.cert, service.key. Build the keystore once:
#   cat ~/kafka-aiven/service.key ~/kafka-aiven/service.cert > ~/kafka-aiven/client-keystore.pem && chmod 600 ~/kafka-aiven/*
security.protocol=SSL
ssl.truststore.type=PEM
ssl.truststore.location=/etc/kafka-client/ca.pem
ssl.keystore.type=PEM
ssl.keystore.location=/etc/kafka-client/client-keystore.pem

# ---- Option B: SASL (user and password of the Users tab). Comment out option A and use these lines instead ------------------------
# security.protocol=SASL_SSL
# sasl.mechanism=SCRAM-SHA-256
# sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="avnadmin" password="THE_PASSWORD";
# ssl.truststore.type=PEM
# ssl.truststore.location=/etc/kafka-client/ca.pem
