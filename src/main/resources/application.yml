# Main configuration file of the application. Almost every value is a ${ENV_VAR} placeholder that the environment, Vault or the Config
# Server supplies at run time.
#
# This file used to be bootstrap.yml, read by the legacy Spring Cloud bootstrap context (spring-cloud-starter-bootstrap). That context
# starts a second, nested SpringApplication before the real one, and Spring AOT captured it instead of the real application: the
# GraalVM binary stopped with "no ServletWebServerFactory bean defined in the context". Vault and the Config Server are now read
# through `spring.config.import` (below), the way mercury, backbone-rest and zerobound-rest do it. The spring.cloud.vault.* and
# spring.cloud.config.* properties are the same ones; only the mechanism that loads them changed.

# Properties of the com.umdc libraries (security-oauth, commons-services). They moved from the old `prx.*` names when the libraries
# moved from com.prx to com.umdc; with the old names nothing binds and the context fails at start (AuthProperties.getClients() is null).
umdc:
  api:
    endpoint: /api/v1
  backbone:
    base-url: ${prx.clients.backbone.url}
  management:
    clientRoles: ${AUTH_ROLE_ID}
  logging:
    trace:
      enabled: ${LOGGING_TRACE_ENABLED}
  security:
    jwt:
      secret: ${APP_TOKEN_SECRET}
      expirationMs: ${APP_TOKEN_EXPIRATION}
    auth:
      clients:
        - id: backbone
          authorization-grant-type: ${BACKBONE_GRANT_TYPE}
          scope: ${BACKBONE_SCOPE}
          client-secret: ${BACKBONE_CLIENT_SECRET}
          client-id: ${BACKBONE_CLIENT_ID}
          redirect-uri: ${AUTH_SERVER_URI}${AUTH_TOKEN_URI}
          username: ${BACKBONE_USERNAME}
          password: ${BACKBONE_PASSWORD}
        - id: mercury
          authorization-grant-type: ${MERCURY_GRANT_TYPE}
          scope: ${MERCURY_SCOPE}
          client-secret: ${MERCURY_CLIENT_SECRET}
          client-id: ${MERCURY_CLIENT_ID}
          redirect-uri: ${AUTH_SERVER_URI}${AUTH_TOKEN_URI}
          username: ${MERCURY_USERNAME}
          password: ${MERCURY_PASSWORD}
# Application specific configurations
prx:
  logging:
    trace:
      enabled: ${LOGGING_TRACE_ENABLED}
  security:
    revocation:
      # false = local development only: revoked tokens stay valid until they expire
      enabled: ${REVOCATION_ENABLED:true}
      # redis[s]://[user:password@]host:port/db - the SAME Redis and db index backbone-rest writes its jti deny-list to
      redis-url: ${REVOCATION_REDIS_URL:}
      # Also the worst-case delay before a revocation takes effect
      cache-ttl: ${REVOCATION_CACHE_TTL:30s}
      command-timeout: ${REVOCATION_REDIS_TIMEOUT:2s}
  cache:
    lesson-catalog:
      # redis[s]://[user:password@]host:port/db of the SmartKin cache. Empty = no cache: every catalog read goes to MongoDB
      redis-url: ${CACHE_REDIS_URL:}
      ttl: ${CACHE_LESSON_CATALOG_TTL:10m}
      command-timeout: ${CACHE_REDIS_TIMEOUT:500ms}
  kafka:
    consumer:
      # Set KAFKA_CONSUMER_ENABLED=false on a deployment that must not process events
      enabled: ${KAFKA_CONSUMER_ENABLED:true}
      group-id: ${KAFKA_CONSUMER_GROUP_ID:smartkin-backend}
      # Records that still fail after the retries go here, with the exception in the headers
      error-topic: ${KAFKA_ERROR_TOPIC:smartkin.events.error.v1}
      max-attempts: ${KAFKA_CONSUMER_MAX_ATTEMPTS:4}
      initial-interval: ${KAFKA_CONSUMER_RETRY_INTERVAL:1s}
      multiplier: ${KAFKA_CONSUMER_RETRY_MULTIPLIER:2.0}
      max-interval: ${KAFKA_CONSUMER_RETRY_MAX_INTERVAL:30s}
  interaction-events:
    # How long raw interaction events are kept before MongoDB expires them (a TTL index on expiresAt)
    retention: ${SMARTKIN_INTERACTION_EVENTS_RETENTION:90d}
  clients:
    # Base URLs of the services reached through Feign; override per environment with BACKBONE_URL and MERCURY_URL
    backbone:
      url: ${BACKBONE_URL:https://prx-qa.backbone.tst/backbone}
    mercury:
      url: ${MERCURY_URL:https://prx-qa.backbone.tst/mercury}
app:
  # The name of the application
  name: smartkin-backend
  # The version of the application
  version: 0.0.1
# Spring Boot specific configurations
# Server specific configurations
# TLS of the Eureka HTTP client. With it the client builds its RestTemplate transport (the TransportClientFactories bean Eureka
# registration needs) and trusts the PRX internal CA through the same truststore as the TLS bundle, so calls to the *.tst Eureka
# servers verify their certificates. Same block as backbone-rest and mercury.
eureka:
  client:
    tls:
      enabled: true
      trust-store: ${SSL_TRUSTSTORE_URL:classpath:${SSL_TRUSTSTORE_LOCATION}}
      trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
      trust-store-type: ${SSL_TRUSTSTORE_TYPE}
# Health probes for the container HEALTHCHECK and Kubernetes: /actuator/health/liveness only says the process is up and never
# looks at Postgres, MongoDB, Redis or Kafka, so a cloud outage does not restart the container. Nothing else is exposed.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  port: ${APP_PORT}
  ssl:
    # Enables SSL for the server
    enabled: true
    # The SSL bundle for the server
    bundle: smartkin-security
    enabled-protocols: TLSv1.3
    compression:
      enabled: true
      mime-types: text/html,text/xml,text/plain,text/css,application/json
      min-response-size: 1024

spring:
  ssl:
    # SSL_KEYSTORE_URL / SSL_TRUSTSTORE_URL (optional, with a scheme, e.g. file:/usr/local/runme/certs/smartkin/smartkin.jks) override the
    # classpath names above: the JVM jar carries the keystores, the GraalVM binary does not embed them and reads them from a mounted path.
    bundle:
      jks:
        smartkin-security:
          keystore:
            location: ${SSL_KEYSTORE_URL:classpath:${SSL_KEYSTORE_LOCATION}}
            password: ${SSL_KEYSTORE_PASSWORD}
            type: ${SSL_KEYSTORE_TYPE}
          truststore:
            location: ${SSL_TRUSTSTORE_URL:classpath:${SSL_TRUSTSTORE_LOCATION}}
            password: ${SSL_TRUSTSTORE_PASSWORD}
            type: ${SSL_TRUSTSTORE_TYPE}
  mvc:
    throw-exception-if-no-handler-found: true
  autoconfigure:
    # Authentication is the library's SessionJwtInterceptor (see SessionTokenSecurityConfig), not a Keycloak-style resource server
    exclude:
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.web.OAuth2ResourceServerWebSecurityAutoConfiguration
  mustache:
    check-template-location: false
  test:
    context:
      failure:
        threshold: 10000000
  main:
    # Allows overriding of bean definitions
    allow-bean-definition-overriding: true
  profiles:
    # Spring Cloud Vault reads <backend>/<context> AND <backend>/<context>/<active profile>; empty = no profile (tests, plain run)
    active: ${SPRING_BOOT_PROFILE_ACTIVE:}
  application:
    # The name of the Spring Boot application, taken from the app.name property
    name: ${app.name}
  config:
    # Property sources read before the application context exists, in this order: Vault, then the Config Server. A later import wins
    # over an earlier one and both win over this file. `optional:` lets the service start (and tests run) when one is not reachable
    # or is switched off (VAULT_ENABLED=false, SPRING_CLOUD_CONFIG_ENABLED=false).
    import: "optional:vault://,optional:configserver:"
  cloud:
    # The active profile for the Spring Boot application
    profile: ${SPRING_BOOT_PROFILE_ACTIVE:}
    #<><><><><><><><><><><><><><> VAULT <><><><><><><><><><><><><><>
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_SERVER_URL:https://vault.umdc-qa.tst}
      authentication: TOKEN
      token: ${VAULT_TOKEN:}
      kv:
        enabled: true
        backend: ${VAULT_KV_BACKEND:UMDC}
        default-context: ${VAULT_KV_CONTEXT:${app.name}}
        # <backend>/<context> and <backend>/<context>/<active profile>
        profile-separator: /
      application-name: ${app.name}
      # Resolved before the TLS bundle exists, so it names the keystore directly. The truststore holds the PRX internal CA that signs
      # every *.tst certificate; the native image has no JVM cacerts import of it (the JVM image gets it from the Dockerfile).
      ssl:
        trust-store: ${SSL_TRUSTSTORE_URL:classpath:${SSL_TRUSTSTORE_LOCATION}}
        trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
        trust-store-type: ${SSL_TRUSTSTORE_TYPE}
    config:
      # The active profile for the Spring Cloud Config
      profile: ${SPRING_BOOT_PROFILE_ACTIVE:}
      # The label for the Spring Cloud Config
      label: ${SPRING_CLOUD_CONFIG_LABEL:}
      # Full URL (scheme, host, port) of the Config Server; ConfigClientProperties has no `port` field
      uri: ${CNFS_URI:http://localhost:8888}
      # Enables sending of state for the Spring Cloud Config
      send-state: true
      # Same internal CA for the Config Server's HTTPS channel
      tls:
        enabled: true
        trust-store: ${SSL_TRUSTSTORE_URL:classpath:${SSL_TRUSTSTORE_LOCATION}}
        trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
        trust-store-type: ${SSL_TRUSTSTORE_TYPE}
  # Database (Supabase PostgreSQL). Host, credentials and port come from Vault or the environment, as ZEROBOUND_DB_* do in zerobound.
  # SMARTKIN_DB_URI is the host only (the transaction pooler, e.g. aws-1-us-east-2.pooler.supabase.com); 6543 is the pooler in transaction mode,
  # where server-side prepared statements are not allowed, hence prepareThreshold=0.
  datasource:
    url: jdbc:postgresql://${SMARTKIN_DB_URI}:${SMARTKIN_DB_PORT:6543}/${SMARTKIN_DB_NAME:umdevc}?prepareThreshold=0
    username: ${SMARTKIN_DB_USERNAME}
    password: ${SMARTKIN_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SmartKinBackendHikariCP
      maximum-pool-size: ${SMARTKIN_DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 30000
      max-lifetime: 1800000
  # Flyway owns the schema. It runs on the direct connection (5432), not through the transaction pooler, because migrations need
  # session-level locks. Production can set FLYWAY_ENABLED=false and apply migrations from the pipeline.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: jdbc:postgresql://${SMARTKIN_DB_URI}:${SMARTKIN_DB_DIRECT_PORT:5432}/${SMARTKIN_DB_NAME:umdevc}
    # Migrations need the schema owner; the application itself should run as the restricted role smartkin_app (decision D-3)
    user: ${SMARTKIN_FLYWAY_USERNAME:${SMARTKIN_DB_USERNAME}}
    password: ${SMARTKIN_FLYWAY_PASSWORD:${SMARTKIN_DB_PASSWORD}}
    locations: classpath:db/migration
    default-schema: ${SMARTKIN_DB_SCHEMA:smartkin}
    schemas: ${SMARTKIN_DB_SCHEMA:smartkin}
    create-schemas: true
    validate-on-migrate: true
  # MongoDB: lesson scenes, quiz attempts and interaction events (documents the relational model should not carry).
  # Credentials with special characters must be URL-encoded. Use SMARTKIN_MONGO_SCHEME=mongodb for a plain host:port server.
  mongodb:
    uri: ${SMARTKIN_MONGO_SCHEME:mongodb+srv}://${SMARTKIN_MONGO_USERNAME}:${SMARTKIN_MONGO_PASSWORD}@${SMARTKIN_MONGO_HOST}/${SMARTKIN_MONGO_DATABASE:smartkin}?retryWrites=true&w=majority
    representation:
      uuid: STANDARD
  data:
    mongodb:
      # Creates the indexes declared on the documents at startup, including the TTL index of interaction_events
      auto-index-creation: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true
    # Defers the initialization of the datasource
    defer-datasource-initialization: true

swagger:
  base-package: 'com.umdc.smartkin.api.v1.controller'
  api-info:
    title: ${app.name}
    version: ${app.version}
    description: ${app.description}
    contact:
      name: 'Luis Antonio Mata'
      url: 'www.umdevcreative.com'
      email: 'luis.antonio.mata@gmail.com'
    cache:
      disabled: true
