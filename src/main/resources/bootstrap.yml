# This is the main configuration file for the application.
# It uses the YAML format for easier readability and nested configuration.

# Application specific configurations
prx:
  logging:
    trace:
      enabled: ${LOGGING_TRACE_ENABLED}
  jwt:
    secret: ${APP_TOKEN_SECRET}
    expirationMs: ${APP_TOKEN_EXPIRATION}
  security:
    revocation:
      # false = local development only: revoked tokens stay valid until they expire
      enabled: ${REVOCATION_ENABLED:true}
      # redis[s]://[user:password@]host:port/db - the SAME Redis and db index backbone-rest writes its jti deny-list to
      redis-url: ${REVOCATION_REDIS_URL:}
      # Also the worst-case delay before a revocation takes effect
      cache-ttl: ${REVOCATION_CACHE_TTL:30s}
      command-timeout: ${REVOCATION_REDIS_TIMEOUT:2s}
  cache:
    lesson-catalog:
      # redis[s]://[user:password@]host:port/db of the SmartKin cache. Empty = no cache: every catalog read goes to MongoDB
      redis-url: ${CACHE_REDIS_URL:}
      ttl: ${CACHE_LESSON_CATALOG_TTL:10m}
      command-timeout: ${CACHE_REDIS_TIMEOUT:500ms}
  interaction-events:
    # How long raw interaction events are kept before MongoDB expires them (a TTL index on expiresAt)
    retention: ${SMARTKIN_INTERACTION_EVENTS_RETENTION:90d}
  clients:
    # Base URLs of the services reached through Feign; override per environment with BACKBONE_URL and MERCURY_URL
    backbone:
      url: ${BACKBONE_URL:https://prx-qa.backbone.tst/backbone}
    mercury:
      url: ${MERCURY_URL:https://prx-qa.backbone.tst/mercury}
  auth:
    clients:
      - id: backbone
        authorization-grant-type: ${BACKBONE_GRANT_TYPE}
        scope: ${BACKBONE_SCOPE}
        client-secret: ${BACKBONE_CLIENT_SECRET}
        client-id: ${BACKBONE_CLIENT_ID}
        redirect-uri: ${AUTH_SERVER_URI}${AUTH_TOKEN_URI}
        username: ${BACKBONE_USERNAME}
        password: ${BACKBONE_PASSWORD}
      - id: mercury
        authorization-grant-type: ${MERCURY_GRANT_TYPE}
        scope: ${MERCURY_SCOPE}
        client-secret: ${MERCURY_CLIENT_SECRET}
        client-id: ${MERCURY_CLIENT_ID}
        redirect-uri: ${AUTH_SERVER_URI}${AUTH_TOKEN_URI}
        username: ${MERCURY_USERNAME}
        password: ${MERCURY_PASSWORD}
app:
  clientRoles: ${AUTH_ROLE_ID}
  # The name of the application
  name: smartkin-backend
  # The version of the application
  version: 0.0.1
# Spring Boot specific configurations
# Server specific configurations
server:
  port: ${APP_PORT}
  ssl:
    # Enables SSL for the server
    enabled: true
    # The SSL bundle for the server
    bundle: smartkin-security
    enabled-protocols: TLSv1.3
    compression:
      enabled: true
      mime-types: text/html,text/xml,text/plain,text/css,application/json
      min-response-size: 1024

spring:
  ssl:
    bundle:
      jks:
        smartkin-security:
          keystore:
            location: classpath:${SSL_KEYSTORE_LOCATION}
            password: ${SSL_KEYSTORE_PASSWORD}
            type: ${SSL_KEYSTORE_TYPE}
          truststore:
            location: classpath:${SSL_TRUSTSTORE_LOCATION}
            password: ${SSL_TRUSTSTORE_PASSWORD}
            type: ${SSL_TRUSTSTORE_TYPE}
  mvc:
    throw-exception-if-no-handler-found: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.SecurityAutoConfiguration
  mustache:
    check-template-location: false
  test:
    context:
      failure:
        threshold: 10000000
  main:
    # Allows overriding of bean definitions
    allow-bean-definition-overriding: true
  profiles:
    active: ${SPRING_BOOT_PROFILE_ACTIVE}
  application:
    # The name of the Spring Boot application, taken from the app.name property
    name: ${app.name}
  security:
    # Disables the security for the Spring Boot application
    oauth2:
      clientRegistrationId: smartkin-backend-client
      client:
        registration:
          external:
            provider: external
            client-id: ${AUTH_CLIENT_ID}
            client-secret: ${AUTH_CLIENT_SECRET}
            scope: profile smartkin-backend-app-scope openid
            authorization-grant-type: password
        provider:
          external:
            issuer-uri: ${AUTH_SERVER_URI}
            jwk-set-uri: ${spring.security.oauth2.client.provider.external.issuer-uri}/protocol/openid-connect/certs
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_URI}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}${AUTH_CERT_URI}
  cloud:
    # The Spring Cloud Config specific configurations
    #<><><><><><><><><><><><><><> VAULT <><><><><><><><><><><><><><>
    vault:
      token: ${VAULT_TOKEN}
      uri: ${VAULT_SERVER_URL}
      kv:
        backend: UMDC
        default-context: ${app.name}
      application-name: ${app.name}
    bootstrap:
      # Enables the Spring Cloud Bootstrap application context
      enabled: ${SPRING_BOOT_CLOUD_BOOTSTRAP_ENABLED}
    # The active profile for the Spring Boot application
    profile: ${SPRING_BOOT_PROFILE_ACTIVE}
    config:
      # The active profile for the Spring Cloud Config
      profile: ${SPRING_BOOT_PROFILE_ACTIVE}
      # The label for the Spring Cloud Config
      label: ${SPRING_CLOUD_CONFIG_LABEL}
      # The URI for the Spring Cloud Config server
      uri: ${CNFS_URI}
      port: ${CNFS_PORT}
      # Enables sending of state for the Spring Cloud Config
      send-state: true
  # Database (Supabase PostgreSQL). Host, credentials and port come from Vault or the environment, as ZEROBOUND_DB_* do in zerobound.
  # SMARTKIN_DB_URI is the host only (the transaction pooler, e.g. aws-1-us-east-2.pooler.supabase.com); 6543 is the pooler in transaction mode,
  # where server-side prepared statements are not allowed, hence prepareThreshold=0.
  datasource:
    url: jdbc:postgresql://${SMARTKIN_DB_URI}:${SMARTKIN_DB_PORT:6543}/${SMARTKIN_DB_NAME:umdevc}?prepareThreshold=0
    username: ${SMARTKIN_DB_USERNAME}
    password: ${SMARTKIN_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SmartKinBackendHikariCP
      maximum-pool-size: ${SMARTKIN_DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 30000
      max-lifetime: 1800000
  # Flyway owns the schema. It runs on the direct connection (5432), not through the transaction pooler, because migrations need
  # session-level locks. Production can set FLYWAY_ENABLED=false and apply migrations from the pipeline.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: jdbc:postgresql://${SMARTKIN_DB_URI}:${SMARTKIN_DB_DIRECT_PORT:5432}/${SMARTKIN_DB_NAME:umdevc}
    user: ${SMARTKIN_DB_USERNAME}
    password: ${SMARTKIN_DB_PASSWORD}
    locations: classpath:db/migration
    default-schema: ${SMARTKIN_DB_SCHEMA:smartkin}
    schemas: ${SMARTKIN_DB_SCHEMA:smartkin}
    create-schemas: true
    validate-on-migrate: true
  # MongoDB: lesson scenes, quiz attempts and interaction events (documents the relational model should not carry).
  # Credentials with special characters must be URL-encoded. Use SMARTKIN_MONGO_SCHEME=mongodb for a plain host:port server.
  mongodb:
    uri: ${SMARTKIN_MONGO_SCHEME:mongodb+srv}://${SMARTKIN_MONGO_USERNAME}:${SMARTKIN_MONGO_PASSWORD}@${SMARTKIN_MONGO_HOST}/${SMARTKIN_MONGO_DATABASE:smartkin}?retryWrites=true&w=majority
    representation:
      uuid: STANDARD
  data:
    mongodb:
      # Creates the indexes declared on the documents at startup, including the TTL index of interaction_events
      auto-index-creation: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true
    # Defers the initialization of the datasource
    defer-datasource-initialization: true

swagger:
  base-package: 'com.umdc.smartkin.api.v1.controller'
  api-info:
    title: ${app.name}
    version: ${app.version}
    description: ${app.description}
    contact:
      name: 'Luis Antonio Mata'
      url: 'www.umdevcreative.com'
      email: 'luis.antonio.mata@gmail.com'
    cache:
      disabled: true
